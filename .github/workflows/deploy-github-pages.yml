# Build static site and publish to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Resolves to current Node.js release from nodejs.org dist (see setup-node README).
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Custom domain (andreysidorov.com) serves this project site at "/" — not "/<repo>/".
          # Using "/<repo>/" would break asset URLs (e.g. /andreysidorov.com/assets → double path on apex).
          # For github.io-only preview without a custom domain, set repo Actions variables PAGES_BASE_PATH
          # and PAGES_SITE_URL, or temporarily use "/andreysidorov.com/" and "https://<owner>.github.io/<repo>".
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
          SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://andreysidorov.com' }}
          VITE_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://andreysidorov.com' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
